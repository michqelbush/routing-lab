name: routing-lab

topology:
  groups:
    routers:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      daemons:
        - ospfd
        - bgpd

  nodes:
    r1:
      group: routers
      startup-config: configs/r1.conf
    r2:
      group: routers
      startup-config: configs/r2.conf
    r3:
      group: routers
      startup-config: configs/r3.conf
    r4:
      group: routers
      startup-config: configs/r4.conf

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]  # Site A internal link (OSPF)
    - endpoints: ["r3:eth1", "r4:eth1"]  # Site B internal link (OSPF)
    - endpoints: ["r1:eth2", "r3:eth2"]  # eBGP link 1
    - endpoints: ["r2:eth2", "r4:eth2"]  # eBGP link 2
